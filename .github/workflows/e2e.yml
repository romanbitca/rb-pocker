# PLAN §17.5 `e2e`: every pull request. Playwright (Chromium + WebKit, six viewports) against the
# production build served by Nest; the offline test and the no-external / no-/api request guard.
name: e2e

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    # Pinned: ubuntu-latest becomes Ubuntu 26 from 19 Oct 2026, and `playwright install
    # --with-deps` supports only the Ubuntu versions its release knows. Move with Playwright.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The E2E build: the production build plus the test hooks (`?seed=`, `window.__pc`) that the
      # Stage 3 acceptance suite needs (PLAN §17.5).
      - run: npm run build:e2e
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      # Finds the E2E build up to date, then runs playwright; its webServer starts `npm start`.
      - run: npm run e2e
        env:
          # PLAN §15.3, §17.5: the speed checks (win chance and long tasks at 6×, and the grading
          # time of Stage 6, tests/e2e/perf.spec.ts) only report here: their numbers go to the job
          # summary and a miss never fails the run. This runner is too noisy to hold a latency budget; the
          # budgets are enforced by `npm run e2e:perf` on a developer machine and by `#bench` on
          # a real phone.
          PERF_REPORT_ONLY: '1'
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
