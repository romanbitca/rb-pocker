# PLAN §17.5 `slow`: weekly (the owner's decision, to save Actions minutes on this private repo)
# and on demand (Actions → slow → Run workflow).
name: slow

on:
  schedule:
    - cron: '17 3 * * 1' # Mondays 03:17 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  slow:
    runs-on: ubuntu-24.04 # the same image as the e2e job (see e2e.yml)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Slow tests (exhaustive, statistical and large property runs)
        run: npm run test:slow

  # The Coolify deploy (§17.6), once the repository variable DEPLOY_URL is set
  # (Settings → Secrets and variables → Actions → Variables).
  check-deploy:
    if: vars.DEPLOY_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Coolify deploys every push to main, so the site should run this commit.
      - run: node scripts/check-deploy.mjs "$DEPLOY_URL" --commit "$GITHUB_SHA"
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
