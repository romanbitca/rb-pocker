# PLAN §17.5 `slow`: weekly (the owner's decision, to save Actions minutes on this private repo)
# and on demand (Actions → slow → Run workflow).
name: slow

on:
  schedule:
    - cron: '17 3 * * 1' # Mondays 03:17 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  slow:
    runs-on: ubuntu-24.04 # the same image as the e2e job (see e2e.yml)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Slow tests (exhaustive, statistical and large property runs)
        run: npm run test:slow

  # PLAN §9.7, Stage 5 acceptance 5 and 6: headless self-play with the real engine and brain
  # (`scripts/selfplay.ts`), one runner per run. Calibration (seed 1, so the numbers are the same
  # every week): each personality against its §9.1 targets, 20,000 hands 6-handed at Medium and at
  # Easy, and the Medium bot decision p95 against the 100 ms budget. Legality: 100,000 hands over
  # table sizes 2 to 9 with random blinds and stacks, Easy and Medium seats mixed, with a fresh
  # seed every week (the report's first line prints it; `--seed <it>` reproduces the run). The
  # report goes to the job summary; a gate that fails fails the job.
  selfplay:
    name: selfplay (${{ matrix.run }})
    runs-on: ubuntu-24.04 # the same image as the e2e job (see e2e.yml)
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - run: medium
            args: --level medium --players 6 --hands 20000 --seed 1 --calibrate --max-p95 100
          - run: easy
            args: --level easy --players 6 --hands 20000 --seed 1 --calibrate
          - run: legality
            args: --level mixed --players 2-9 --stacks random --hands 100000 --seed ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Self-play (${{ matrix.run }})
        run: npm run selfplay -- ${{ matrix.args }} --quiet

  # PLAN §7.5: the committed tables are exactly what `npm run gen` makes. Every cell has
  # its own fixed seed, so the bytes are the same on every machine and thread count. About 3
  # minutes on a 10-core laptop; on the 2-vCPU runner expect 15 to 25 minutes (the range and push/fold tables add about 1 minute and 8 to 12).
  tables:
    runs-on: ubuntu-24.04 # the same image as the e2e job (see e2e.yml)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Regenerate the tables (preflop, ranges, push/fold)
        run: npm run gen
      - name: The committed tables are what the generator makes
        run: git diff --exit-code -- apps/web/src/data/generated

  # PLAN §15.3, §17.5: the two throttled speed checks of tests/e2e/perf.spec.ts (win chance and
  # long tasks at 6×), report-only here as in the PR e2e job: the numbers are in this job's
  # summary, a miss never fails the run. This runner is too noisy to hold a latency budget; the
  # budgets are enforced by `npm run e2e:perf` on a developer machine and by `#bench` on a real
  # phone. Only the two Stage 4 checks run (the Stage 3 long-task test is enforced in every PR).
  perf:
    runs-on: ubuntu-24.04 # the same image as the e2e job (see e2e.yml)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:e2e
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Speed checks at 6× (report only)
        run: npm run e2e:perf -- --grep "Stage 4"
        env:
          PERF_REPORT_ONLY: '1'
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-perf
          path: apps/web/playwright-report/
          retention-days: 7

  # The Coolify deploy (§17.6), once the repository variable DEPLOY_URL is set
  # (Settings → Secrets and variables → Actions → Variables).
  check-deploy:
    if: vars.DEPLOY_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Coolify deploys every push to main, so the site should run this commit.
      - run: node scripts/check-deploy.mjs "$DEPLOY_URL" --commit "$GITHUB_SHA"
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
