# PLAN §17.5 `check`: every push to main and every pull request.
name: check

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request or branch cancels the run it replaces (saves minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04 # the same image as the e2e job (see e2e.yml)
    # The slowest runs so far took 14 of the old 15 minutes (the unit suite ran twice); the suite
    # grows with every chunk and the runner's speed varies by a factor of two.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck (both apps)
        run: npm run typecheck
      - name: Lint (module boundaries, Math.random ban, server-must-not-import-web)
        run: npm run lint
      - run: npm run format:check
      # The web unit and property tests run once, under V8 coverage, and fail below the thresholds
      # (apps/web/vitest.config.ts: src/engine 95% branches, src/eval, src/persist and
      # src/analysis 90%, src/brain 85%). The coverage run leaves out the volume and timing tests
      # (they reach no new code and V8 makes them several times slower): they run next, without
      # coverage, and the server tests after them. Together that is every test of `npm test`.
      - name: Unit and property tests, coverage thresholds
        run: npm run test:coverage
      - name: Volume and timing tests (left out of the coverage run)
        run: npm run test:volume
      - name: Server tests
        run: npm test -w @rb/server
      # PLAN §7.5: the generated preflop tables match their checksums, the finals agree with the
      # published 7-card counts, and 20 equity cells sampled again (200,000 trials) are within
      # 0.5 points of the committed ones. Takes seconds.
      - name: Generated tables (checksums, 20 cells re-sampled)
        run: npm run gen:check
      # PLAN §8.10, Stage 5 acceptance 7: every coach template and glossary key, then the hints of
      # 1,000 situations generated with the engine (sentences ≤ 15 words, placeholders, glossary,
      # the HUD's win chance in every hint, RANGE_ADJUST). Takes a few seconds.
      - name: Coach copy (templates, glossary, 1,000 generated situations)
        run: npm run check:copy -w @rb/web
      - run: npm run build
      - name: Size budget (§15.3)
        run: npm run size
      - name: Built index.html has no inline script and carries the meta CSP (§15.2)
        run: npm run check:html -w @rb/web
